[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Astro builds static HTML; default Netlify settings handle it fine.
# _redirects file in /public is read automatically and merged with site redirects.

# Bundle the Canva voucher template PDF next to the webhook so pdf-lib can
# load it at runtime. (pdf-lib itself bundles cleanly via esbuild — no
# external_node_modules declaration needed.)
[functions]
  included_files = [
    "netlify/functions/assets/**"
  ]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
