[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Astro builds static HTML; default Netlify settings handle it fine.
# _redirects file in /public is read automatically and merged with site redirects.

# pdfkit ships .afm font files and uses dynamic requires that esbuild can't
# reliably bundle. Mark it (and its font subdep) external so Netlify copies
# the full package into the function at runtime instead.
[functions]
  external_node_modules = ["pdfkit", "fontkit"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
